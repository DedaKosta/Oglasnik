version: '3.8'

services:
  # Keycloak Service
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: oglasnik-keycloak
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password

      # Hostname configuration
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      # HTTP configuration
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080

      # Proxy configuration (for development)
      KC_PROXY: edge
    command:
      - start-dev
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - oglasnik-network
    volumes:
      - keycloak-data:/opt/keycloak/data

  # Keycloak Database
  keycloak-db:
    image: postgres:16-alpine
    container_name: oglasnik-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5433:5432"  # Different port to avoid conflict with app DB
    networks:
      - oglasnik-network
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  # Application Database (Your existing PostgreSQL)
  app-db:
    image: postgres:16-alpine
    container_name: oglasnik-app-db
    environment:
      POSTGRES_DB: oglasnik
      POSTGRES_USER: oglasnik_user
      POSTGRES_PASSWORD: oglasnik_password
    ports:
      - "5434:5432"
    networks:
      - oglasnik-network
    volumes:
      - app-db-data:/var/lib/postgresql/data

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: oglasnik-minio
    environment:
      # Admin credentials
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

      # Console configuration
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API endpoint
      - "9001:9001"  # Web console
    networks:
      - oglasnik-network
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  oglasnik-network:
    driver: bridge

volumes:
  keycloak-data:
  keycloak-db-data:
  app-db-data:
  minio-data:
